name: Keep backend warm

# Best-effort ping so Render's free tier doesn't spin down. Intentionally NEVER
# fails or cancels: it's a keep-alive, not a monitor. A single 90s curl outlasts a
# cold start (~40s); if the backend is momentarily unreachable (e.g. mid-redeploy),
# `|| true` swallows it and the run stays green — the next run pokes it again.
# GitHub may delay scheduled runs a few minutes under load; that's fine.
# The real fix for cold starts is a paid Render plan (no spin-down, no keep-alive).

on:
  schedule:
    - cron: '*/10 * * * *'   # roughly every 10 minutes (Render idles at ~15 min)
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /health (never fails the run)
        run: |
          code=$(curl -s -m 90 -o /dev/null -w "%{http_code}" \
            https://jobtrack-ai-backend.onrender.com/health || echo "000")
          echo "health -> HTTP $code"
